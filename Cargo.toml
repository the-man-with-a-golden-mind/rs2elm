[workspace]
members = ["elm_rs", "elm_rs_derive"]
resolver = "2"

[workspace.package]
authors = ["Michał <michmajchrzak@gmail.com>"]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/the-man-with-a-golden-mind/rs2elm"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
rs2elm_derive = { path = "elm_rs_derive", version = "0.1.0" }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
rs2elm = { path = "elm_rs" }
rs2elm_derive = { path = "elm_rs_derive" }
